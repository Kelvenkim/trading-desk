name: 시세 데이터 갱신

on:
  schedule:
    # GitHub cron은 UTC 기준. KST = UTC+9
    - cron: "*/30 0-6 * * 1-5"   # 평일 09:00~15:30 KST, 30분마다
    - cron: "45 6 * * 1-5"        # 평일 15:45 KST, 장 마감 후 한 번 더
    - cron: "30 22 * * 1-5"       # 평일 07:30 KST, 미국장 마감 반영
  workflow_dispatch: {}            # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 시세 받기
        run: python scripts/fetch_data.py

      - name: 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: 시세 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            git push
          fi
