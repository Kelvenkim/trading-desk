name: 시세 데이터 갱신

on:
  schedule:
    # GitHub cron은 UTC 기준. 미국 정규장 = UTC 13:30~20:00(서머타임) / 14:30~21:00(표준시)
    - cron: "*/30 13-21 * * 1-5"   # 미국장 중 30분마다 (관심종목 시세·뉴스)
    - cron: "15 0,4,8,11 * * *"    # 장 밖에서도 뉴스·인물 발언은 몇 번 더
  workflow_dispatch: {}            # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 시세 받기
        run: python scripts/fetch_data.py

      - name: AI 데스크 체결 (주문·손절·추적 손절·급락 중단)
        run: python scripts/ai_paper.py fill || echo "AI 체결 실패 (다음에 다시)"
      - name: AI 데스크 장 전·장중 회의 (6명 에이전트)
        run: cd scripts && python ai_desk.py live || echo "AI 회의 실패 (다음에 다시)"

      - name: 뉴스·인물 발언 단어
        run: python scripts/news_build.py || echo "뉴스 갱신 실패 (다음에 다시)"

      - name: 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: 시세 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            git push
          fi
