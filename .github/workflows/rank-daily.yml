name: 매일 순위

on:
  # 사이트를 미국 위주로 바꾸면서 한국 순위 자동 실행은 멈춤 (필요하면 Actions 탭에서 수동 실행)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data          # 시세 갱신과 동시에 커밋하지 않도록 같은 줄에 세움
  cancel-in-progress: false

jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 순위 계산·채점
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/rank_daily.py
      - name: 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rank data/narrative
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "rank: 매일 순위 $(TZ=Asia/Seoul date '+%Y-%m-%d')"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
