name: 코인 오더블록 · 10배 단타 모의 계좌

on:
  schedule:
    - cron: "11 * * * *"    # 매시간 (1시간봉 마감 뒤). GitHub 예약이 늦거나 빠져도 다음 실행 때 밀린 봉을 순서대로 처리
    - cron: "26 * * * *"    # 11/22: GitHub가 예약을 자주 건너뜀(4시간 넘게 안 돎) → 시간당 4번 걸어둠
    - cron: "41 * * * *"
    - cron: "56 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  ob:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 오더블록 계좌
        run: python scripts/ob_paper.py
      - name: AMD (매집→조작→분산)
        run: python scripts/amd_paper.py
      - name: 코인 10배 (AMD 칸 + 오더블록 칸)
        run: python scripts/amd_paper.py lev10 && python scripts/ob_paper.py lev10
      - name: 코인 1배 (AMD 칸 + 오더블록 칸)
        run: python scripts/amd_paper.py coin && python scripts/ob_paper.py coin
      - name: 10배 단타 (추세 눌림)
        run: python scripts/trend_paper.py
      - name: 50일선 계좌·칸 평가 갱신 (11/22: 매시간 지금 가격 반영 — 매매 판단은 새 일봉 때만)
        run: |
          python scripts/crypto_paper.py || true
          python scripts/crypto_lev.py || true
          python scripts/crypto_paper.py coin3 || true
          python scripts/crypto_lev.py lev3 || true
      - name: 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/us/crypto_*.json data/us/ob_paper.json data/us/trend10.json data/us/amd_paper.json data/us/lev10.json data/us/lev10_ob.json data/us/coin_amd.json data/us/coin_ob.json
          git diff --cached --quiet && exit 0
          git commit -m "오더블록·10배 단타 계좌 갱신"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
