name: 코인 모의 계좌

on:
  schedule:
    - cron: "7 */2 * * *"   # 2시간마다, 주말 포함 (GitHub 예약은 자주 늦거나 빠지니 여러 번 걸어둠 — 매매 판단은 새 일봉당 한 번만)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data   # 같은 data 폴더를 쓰는 작업과 겹치지 않게
  cancel-in-progress: false

jobs:
  crypto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 코인 계좌
        run: python scripts/crypto_paper.py
      - name: 10배 레버리지 실험 계좌
        run: python scripts/crypto_lev.py || echo "10배 계좌 실패"
      - name: 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/us/crypto_*.json
          git diff --cached --quiet && exit 0
          git commit -m "코인 계좌 갱신"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
