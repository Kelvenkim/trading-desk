name: 공식 피드백방

on:
  schedule:
    - cron: "23 23 * * *"   # 매일 08:23 (한국) — 아침 보고서(08:47) 전에
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  coach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 코치 봇 시험
        run: python scripts/coach.py
      - name: 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/us/coach.json
          git diff --cached --quiet && exit 0
          git commit -m "공식 피드백방 갱신"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
