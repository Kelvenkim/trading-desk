name: 순위 과거 검증 다시 계산

# DART 키를 넣은 뒤 한 번 실행하면 실적 항목도 과거 공시로 검증해요 (15~25분)
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 과거 시세 받기
        run: python research/rank/fetch.py
      - name: 과거 검증
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/rank_backfill.py && python scripts/rank_daily.py --force
      - name: 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rank
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "rank: 과거 검증 다시 계산"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
